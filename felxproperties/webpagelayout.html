<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    nav {
      border: 2px solid gray;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      background-color: rgb(55, 53, 53);
    }
    .content {
      display: flex;
      gap: 40px;
      padding: 0 8px;
      text-align: center;
    }
    .logo {
      color: aliceblue;
      padding: 0 8px;
    }
    .logo:hover {
        cursor: pointer;
    }
    .content a {
      color: azure;
      text-decoration: none;
    }
    .logo:hover h1{
        color: yellow;
    }
    .content:hover a{
        color: rgb(37, 190, 139);
    }
 .outter{
    text-align: center;
    border: 2px solid gray;
    width: 100%;
    height: 200px;
 }
  </style>
  <body>
    <nav>
      <div class="logo">
        <h1>JSPIDERS</h1>
      </div>

      <div class="content">
        <a href="">HOME</a>
        <a href="">ABOUT</a>
        <a href="">CONTACT</a>
        <a href="">LOGOOUT</a>
      </div>
    </nav>

    <section class="inner">
        <div class="outter"> 
            <h1>WELCOME TO JSPIDERS</h1>
        </div>
        
    </section>
  </body>
</html>
