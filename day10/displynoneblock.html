<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        border: 1px solid rgb(255, 255, 0);
        width: 200px;
        margin: auto;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 2px 3px 4px goldenrod;
    }
    .dropdown{
        /* border: 2px solid brown; */
        width: 160px;
        padding: 12px;
        height: 120px;
        margin: auto;
        text-align: center;
        display: none;
    }
    img{
        display: block;
        width: 100%;
        height: 150px;
    }
    button{
        border: none;
        padding:    7px 16px;
        background-color: goldenrod;
        border-radius: 10px;
        color: white;
        

    }
    .container:hover .dropdown{
        display: block;
    }
    button:hover{
        cursor: pointer;
    }
    span{
        color: gold;
    }
    



</style>
<body>
    <div class="container">
        <img src="./ship.png" alt="">
        <div class="dropdown">
            <p>Pirates of the Caribbean</p>
            <p><span>&star;&star;&star;&star;&star;</span> 10/10</p>
            <button>book tickets</button>
        </div>
    </div>
</body>
</html>
