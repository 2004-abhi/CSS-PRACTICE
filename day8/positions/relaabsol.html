<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        height: 800px;
        width: 100%;
        position: relative;
        background-image: url(./odd.png);
        background-repeat: no-repeat;
        background-position: center;
        border: 2px solid red;
        background-size: cover;
    }
    .content
    {
        position: absolute;
        top: 50%;
        color: rgb(110, 101, 208);
        text-align: center;
        left: 3%;
    }
    h1{
        font-size: 90px;
        text-shadow: 5px 6px 6px orange
    }
    button{
        padding: 10px 20px;
        font-size: 20px;
        background-color: rgb(126, 126, 183);
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        border-radius: 30px;
        border: none;
    }
</style>
<body>
    <div class="container"></div>
    <div class="content">
        <h1>WELCOME TO I MAX SHOW...👻</h1>
        <button>BOOK TICKET</button>
