<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:first-child{
            color: blue;
        }
        li:last-child{
            color: blueviolet;
        }
        li:nth-child(3){
            color: brown;
        }
        li:nth-child(2){
            color: cadetblue;
        }
    </style>
</head>
<body>
    <ul>
        <li>pallana</li>
        <li>haripad</li>
        <li>purakad</li>
        <li>karuvatta</li>
    </ul>
</body>
</html>
