<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f5f5f5;
    }

    nav {
      height: 65px;
      background-color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 50px;
      color: white;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 30px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 16px;
    }

    .hero {
      height: 600px;
      background-image: url("./bgm.png");
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
      color: white;
    }

    .hero-content h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero-content p {
      font-size: 18px;
      margin-bottom: 20px;
    }
    .hero-content button {
      padding: 12px 25px;
      background-color: #f2b84b;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .products {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 40px;
      flex-wrap: wrap;
    }

    .card {
      width: 220px;
      background-color: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 2px 3px 10px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .card-content p {
      color: #555;
      margin-bottom: 12px;
    }
    .card-content button {
      background-color: #73b85c;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
    @media(max-width:600px){
    .outer{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        align-items:center;
    }
     /* .card{
        width:90%;
    } */
     nav{
        flex-direction:column;
        /* display:flex; */
        /* flex-wrap:wrap; */
        /* justify-content:center;
        align-items:center; */
    }
     }
  </style>
  <body>
    <nav>
      <div class="logo">FoodHub</div>

      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>
    </nav>

    <section class="hero">
      <div class="hero-content">
        <h1>Fresh Food Delivered To Your Door</h1>
        <p>Order delicious meals from your favourite restaurants.</p>

        <button>Order Now</button>
      </div>
    </section>

    <section class="products">
      <div class="card">
        <img src="./burger.png" alt="Burger" />

        <div class="card-content">
          <h2>Burger</h2>
          <p>$8.99</p>

          <button>Buy Now</button>
        </div>
      </div>

      <div class="card">
        <img src="./pizaa.png" alt="Pizza" />

        <div class="card-content">
          <h2>Pizza</h2>
          <p>$10.99</p>

          <button>Buy Now</button>
        </div>
      </div>

      <div class="card">
        <img src="./pasta.png" alt="Pasta" />

        <div class="card-content">
          <h2>Pasta</h2>
          <p>$9.99</p>

          <button>Buy Now</button>
        </div>
      </div>

      <div class="card">
        <img src="./swand.png" alt="Sandwich" />

        <div class="card-content">
          <h2>Sandwich</h2>
          <p>$7.99</p>

          <button>Buy Now</button>
        </div>
      </div>
    </section>

    <footer>
      <p>© 2026 FoodHub</p>
    </footer>
  </body>
</html>
