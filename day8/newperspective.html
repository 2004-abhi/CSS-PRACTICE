<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        .container{
            width:100%;
            height:100vh;

            background-image:url("../day8/positions/seen.png");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            /* border-radius: 30px; */

            position:relative;
        }

        .content{
            position:absolute;

            top:50%;
            left:50%;

            transform:translate(-50%,-50%);

            text-align:center;
            color:white;
        }

        .content h1{
            font-size:70px;
            margin-bottom:20px;
        }

        .content p{
            font-size:28px;
            width:850px;
            margin:auto;
            line-height:40px;
            margin-bottom:40px;
        }

        button{
            padding:18px 40px;
            font-size:24px;
            font-weight:bold;

            border:none;
            border-radius:12px;

            background:white;
            color:#333;

            cursor:pointer;
        }

        button:hover{
            background:#dddddd;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="content">

        <h1>A New Perspective</h1>

        <p>
            Our innovative approach redefines industry standards,
            creating solutions that are both powerful and elegant.
        </p>

        <button>Learn More About Us</button>

    </div>

</div>

</body>
</html>
