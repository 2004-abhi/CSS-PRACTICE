<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <style>
    .card {
      width: 380px;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      transition: 0.3s;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .image-box {
      position: relative;
    }

    .image-box img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .breakfast {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #4caf50;
      color: white;
      padding: 8px 15px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
    }
    .content {
      padding: 20px;
    }
    .title {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .title h1 {
      font-size: 30px;
      margin-bottom: 5px;
    }

    .title p {
      color: #2eaf58;
      font-size: 18px;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .location {
      display: block;
      margin: 8px 0;
      color: #666;
     font-size: 17px;
    }

    .location i {
      color: #555;
      margin-right: 5px;
    }

    .details {
      display: flex;
      gap: 20px;
      /* justify-content: space-between; */
      align-items: center;
      margin: 20px 0;
      font-size: 15px;
      color: #666;
    }

    .details span i {
      margin-right: 5px;
      color: #444;
    }
    button {
      width: 100%;
      padding: 15px;
      border: none;
      background: #2f80ed;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1d67ca;
    }
  </style>

  <body>
    <section class="card">
      <div class="image-box">
        <img src="./mum.png" alt="" />
        <span class="breakfast">Free Brakefast</span>
      </div>

      <div class="content">
        <div class="title">
          <h2>City Comfort Inn</h2>
          <!-- <br /> -->
          <p><i class="fa-solid fa-star"></i>4.6 (980 reviews)</p>
        </div>
        <span class="location">
          <i class="fa-solid fa-location-dot"></i> Mumbai,india
        </span>

        <div class="details">
          <span><i class="fa-solid fa-wifi"></i> Free Wi-Fi</span>
          <span><i class="fa-solid fa-water-ladder"></i> Pool</span>
          <span><i class="fa-solid fa-hot-tub-person"></i> Spa</span>
        </div>

        <div class="rate">
          <h2>&#8377;2,499 / night</h2>
        </div>
        <button>View Details</button>
      </div>
    </section>
  </body>
</html>
