<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    section {
      /* border: 2px solid red; */
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      height: 100%;
      gap: 90px;
      padding: 30px;
      background-color: rgb(139, 138, 138);
    }
    h1 {
      text-align: center;
     
      font-size: 30px;
      color: whitesmoke;
      /* border: 1px solid black; */
      background-color: rgb(110, 114, 114);
    }
    .card {
      width: 250px;
      text-align: center;
      border-radius: 12px;
      overflow: hidden;
      /* border: 2px solid blue; */
      background-color: rgb(157, 158, 158);
      box-shadow: 0px 0px 10px rgb(44, 43, 43);
    }
    img {
      width: 100%;
      height: 160px;
      border-radius: 10px;
    }
    nav {
      /* border: 1px solid greenyellow; */
      display: flex;
      justify-content: center;
    }
    button {
      width: 100%;
      padding: 8px 20px;
      background-color: rgb(37, 37, 39);
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      box-shadow: 0px 0px 5px white;

    }
    button:hover{
      cursor: pointer;
    }
    article {
      padding: 10px;
      /* border: 2px solid blueviolet; */
    }
    h2 {
      margin-bottom: 10px;
    }
    p{
      margin-bottom: 10px;
      color: rgb(49, 52, 196);
    }
    nav {
      padding: 20px;
      background-color: black;
      text-align: center;
    }
    nav a {
      font-size: 18px;
      color: white;
      margin-right: 15px;
      text-decoration: none;
    }
  </style>
  <body>
    <nav>
      <a href="">HOME</a>
      <a href="">ABOUT</a>
      <a href="">SERVICE</a>
      <a href="">OFFERS</a>
      <a href="">CONTACT</a>
    </nav>
    <h1><span>WELCOME TO TRENDING PRODUCTS...👻</span></h1>
    <section>
      <div class="card">
        <img src="./LAP.png" alt="" />
          <article>
        <h2>LAPTOP</h2>
        <p>&#8377; 75000</p>
        <button>ADD TO CART</button>
        </article>
      </div>

      <div class="card">
        <img src="./keyboard.png" alt="" />
        <article>
          <h2>KEYBOARD</h2>
          <p>&#8377; 2000</p>
          <button>ADD TO CART</button>
        </article>
      </div>

      <div class="card">
        <img src="./mouse.png" alt="" />
        <article>
          <h2>MOUSE</h2>
          <p>&#8377; 1500</p>
          <button>ADD TO CART</button>
        </article>
      </div>

      <div class="card">
        <img src="./headphones.png" alt="" />
        <article>
          <h2>HEADPHONES</h2>
          <p>&#8377; 3000</p>
          <button>ADD TO CART</button>
        </article>
      </div>

      <div class="card">
        <img src="./smartwatch.png" alt="" />
        <article>
          <h2>SMARTWATCH</h2>
          <p>&#8377; 4500</p>
          <button>ADD TO CART</button>
        </article>
      </div>

      <div class="card">
        <img src="./speaker.png" alt="" />
        <article>
          <h2>SPEAKER</h2>
          <p>&#8377; 5000</p>
          <button>ADD TO CART</button>
        </article>
      </div>
    </section>
  </body>
</html>
