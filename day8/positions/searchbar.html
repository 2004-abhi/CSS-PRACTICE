<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      div {
        border: 1px solid rgb(18, 159, 202);
        padding: 8px;
        width: 400px;
        margin: 50px auto;
        border-radius: 20px;
        position: relative;

      }
      input{
        border: none;
        outline: none;
        font-size: 20px;
        margin-left: 30px;

      }
      i{
                font-size: 15px;
            color: grey;
      }
               .fa-magnifying-glass{
            position: absolute;
            left: 16px;
            top: 14px;
            color: grey;}


                     .fa-camera{
            position: absolute;
            right: 85px;
            top: 14px;
            color: lightblue;}

            .fa-microphone{
                position: absolute;
                right: 30px;
                top: 14px;
                color: aquamarine;
                

            }

      
    </style>
  </head>
  <body>
    <div>
        <!-- &nbsp;&nbsp;&nbsp; -->
        <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="Enter name" /> 
      <!-- &nbsp;&nbsp;&nbsp; -->
      <i class="fa-solid fa-camera"></i> 
      <!-- &nbsp;&nbsp; -->
        <i class="fa-solid fa-microphone"></i>
    </div>
  </body>
</html>
